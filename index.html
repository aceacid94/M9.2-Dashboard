<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astro Go PayTV Status</title>

<style>
html, body {
    margin: 0;
    overflow: auto;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 12px;
}

.container {
    width: 95%;
    max-width: 1400px;
    margin: 10px auto;
}

.row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.row.top .section { flex: 1; min-width: 300px; }

.section {
    background: #1e293b;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    min-width: 0;
}

.bug-fix { flex: 2; min-width: 400px; }
.bug-raised { flex: 1; min-width: 200px; }
.bug-breakdown { flex: 1; min-width: 200px; }

/* ✅ HEADER RESTORED */
.header {
    text-align: center;
    margin-bottom: 10px;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.header p {
    margin: 2px;
    font-size: 12px;
    color: #94a3b8;
}

/* ✅ section header */
.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* ✅ FIX TABLE ALIGNMENT */
th, td {
    text-align: left;   /* ✅ FIXED */
    padding: 6px;
    white-space: nowrap;
}

th {
    color: #94a3b8;
}

/* table */
table {
    width: 100%;
    border-collapse: collapse;
    min-width: max-content;
}

td {
    border-top: 1px solid #334155;
}

/* colors */
.warn { color: #facc15; }
.good { color: #22c55e; }
.bad { color: #ef4444; }

/* ✅ PROGRESS BAR BACK */
.progress {
    background: #334155;
    height: 6px;
    border-radius: 6px;
    margin-top: 3px;
    min-width: 80px;
}

.progress-bar {
    height: 100%;
    background: #22c55e;
    border-radius: 6px;
}

/* ✅ SMALL DROPDOWN */
.dropdown {
    background: #0f172a;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 10px;
    height: 22px;
    flex-shrink: 0;
}

/* Scrollbar styling */
.section::-webkit-scrollbar {
    height: 6px;
}

.section::-webkit-scrollbar-track {
    background: #0f172a;
    border-radius: 6px;
}

.section::-webkit-scrollbar-thumb {
    background: #475569;
    border-radius: 6px;
}

.section::-webkit-scrollbar-thumb:hover {
    background: #64748b;
}
</style>
</head>

<body>

<div class="container">

<!-- ✅ HEADER FIX -->
<div class="header">
    <h1>Astro Go PayTV Status</h1>
    <p>Small Screen Timeline: 02 JULY - 23 JULY </p>
    <p>Big Screen Timeline: 21 JULY - 7 AUGUST </p>
    <p>Environment: Beta-Production</p>
</div>

<!-- TOP -->
<div class="row top">

<!-- OVERALL -->

<!-- M9 -->


<!-- M7 -->

<!-- BOTTOM -->
<div class="row">

<!-- BUG FIX -->
<div class="section bug-fix">
<h3>Bug Fixes Status</h3>
<table>
<tr>
<th>Platform</th><th>Delivered</th><th>Resolved[IN PROGRESS]</th><th>Done</th><th>Reopened</th><th>%</th>
</tr>
<tbody id="bugFixTable"></tbody>
</table>
</div>

<!-- BUG RAISED -->
<div class="section bug-raised">
<div class="section-header">
<h3>New Bugs Raised</h3>

<select class="dropdown" onchange="handleMenu(this)">
<option value="">JIRA</option>
<option value="jira">Total M9 JIRA Raised Dashboard</option>
</select>
</div>

<table>
<tr><th>Platform</th><th>L1</th></tr>
<tbody id="bugRaisedTable"></tbody>
</table>
</div>

<!-- BREAKDOWN -->
<div class="section bug-breakdown">
<h3>Bug Raised Breakdown</h3>
<table>
<tr><th>Category</th><th>Total</th></tr>
<tbody id="bugBreakdownTable"></tbody>
</table>
</div>

</div>

</div>

<script>

/* OVERALL + PROGRESS */


/* M9 + PROGRESSs */

/* M8 + PROGRESS */

  
/* M9 PROGRESS */

/* M8 PROGRESS */

/* BUG RAISED */
const br=[0,0,0,0,0,0,0];
const names=["Web","Android","iOS","ATV","LG","SAMSUNG","VIDAA"];
let total=0, html="";

for(let i=0;i<br.length;i++){
 total+=br[i];
 html+=`<tr><td>${names[i]}</td><td class="warn">${br[i]}</td></tr>`;
}
html+=`<tr><td><b>Total</b></td><td class="good"><b>${total}</b></td></tr>`;
document.getElementById("bugRaisedTable").innerHTML=html;

/* BUG FIX + PROGRESS */
const bf=[
 {n:"Web",d:45,res:26,done:17,r:2},
 {n:"Android",d:76,res:62,done:14,r:0},
 {n:"iOS",d:68,res:60,done:7,r:1},
 {n:"ATV",d:86,res:85,done:0,r:1},
 {n:"LG",d:78,res:55,done:21,r:2},
 {n:"SAMSUNG",d:78,res:56,done:20,r:2},
 {n:"VIDAA",d:75,res:54,done:19,r:2},
];

document.getElementById("bugFixTable").innerHTML =
bf.map(p => {
    let pct = ((p.done + p.r) / p.d * 100).toFixed(1);

    return `<tr>
        <td>${p.n}</td>
        <td>${p.d}</td>
        <td>${p.res}</td>
        <td>${p.done}</td>
        <td>${p.r}</td>
        <td>
            ${pct}%
            <div class="progress">
                <div class="progress-bar" style="width:${pct}%"></div>
            </div>
        </td>
    </tr>`;
}).join("");


/* BUG BREAKDOWN + TOTAL SUM */
const breakdown = [
 {c:"Component Functionality",t:1,cl:"bad"},
];

let breakdownTotal = 0;
let breakdownHtml = "";

for(let i=0;i<breakdown.length;i++){
 breakdownTotal += breakdown[i].t;
 breakdownHtml += `<tr><td>${breakdown[i].c}</td><td class="${breakdown[i].cl}">${breakdown[i].t}</td></tr>`;
}

breakdownHtml += `<tr><td><b>Total</b></td><td class="good"><b>${breakdownTotal}</b></td></tr>`;
document.getElementById("bugBreakdownTable").innerHTML = breakdownHtml;

/* DROPDOWN */
function handleMenu(select){
 if(select.value==="jira"){
  window.open("https://astrogo.atlassian.net/issues/?jql=filter%3D57938","_blank");
 }
 select.value="";
}

</script>

</body>
</html>
